#
# Standalone Coolify compose derived from docker-compose.hobby.yml.
#
# Keep this file compact and hand-maintained. Do not generate it with
# `docker compose config`: that expands anchors, local paths, and build config
# enough to exceed Coolify's pasted compose limits.
#

x-logging: &default-logging
    driver: json-file
    options:
        max-size: '50m'
        max-file: '3'

x-posthog-env: &posthog-env
    SITE_URL: https://$DOMAIN
    SECRET_KEY: $POSTHOG_SECRET
    ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
    DEPLOYMENT: hobby
    OTEL_SDK_DISABLED: 'true'
    OTEL_EXPORTER_OTLP_ENDPOINT: ''
    DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
    PGHOST: db
    PGUSER: posthog
    PGPASSWORD: posthog
    REDIS_URL: redis://redis7:6379/
    KAFKA_HOSTS: kafka:9092
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_DATABASE: posthog
    CLICKHOUSE_SECURE: 'false'
    CLICKHOUSE_VERIFY: 'false'
    CLICKHOUSE_USER: default
    CLICKHOUSE_PASSWORD: ''
    CLICKHOUSE_CLUSTER: posthog
    CLICKHOUSE_SINGLE_SHARD_CLUSTER: posthog_single_shard
    CLICKHOUSE_WRITABLE_CLUSTER: posthog_writable
    CLICKHOUSE_PRIMARY_REPLICA_CLUSTER: posthog_primary_replica
    CLICKHOUSE_MIGRATIONS_CLUSTER: posthog_migrations
    CLICKHOUSE_API_USER: api
    CLICKHOUSE_API_PASSWORD: apipass
    CLICKHOUSE_APP_USER: app
    CLICKHOUSE_APP_PASSWORD: apppass
    CLICKHOUSE_BILLING_USER: billing
    CLICKHOUSE_BILLING_PASSWORD: billingpass
    OBJECT_STORAGE_ENABLED: 'true'
    OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
    OBJECT_STORAGE_PUBLIC_ENDPOINT: https://$DOMAIN
    OBJECT_STORAGE_ACCESS_KEY_ID: object_storage_root_user
    OBJECT_STORAGE_SECRET_ACCESS_KEY: object_storage_root_password
    OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
    SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
    SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: any
    SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: any
    RECORDING_API_URL: http://recording-api:6738
    API_QUERIES_PER_TEAM: '{"1": 100}'
    CDP_API_URL: http://plugins:6738
    FLAGS_REDIS_ENABLED: 'false'
    PERSONHOG_ADDR: personhog-router:50052
    PERSONHOG_ENABLED: 'true'
    PERSONHOG_ROLLOUT_PERCENTAGE: '100'
    IS_BEHIND_PROXY: 'true'
    DISABLE_SECURE_SSL_REDIRECT: 'true'

services:
    db:
        image: ${DOCKER_REGISTRY_PREFIX:-}postgres:15.12-alpine
        restart: on-failure
        logging: *default-logging
        environment:
            POSTGRES_USER: posthog
            POSTGRES_DB: posthog
            POSTGRES_PASSWORD: posthog
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U posthog']
            interval: 5s
            timeout: 30s
            retries: 30
            start_period: 10s
        volumes:
            - postgres-data:/var/lib/postgresql/data

    redis7:
        image: redis:7.2-alpine
        restart: on-failure
        logging: *default-logging
        command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 3s
            timeout: 10s
            retries: 10
        volumes:
            - redis7-data:/data

    zookeeper:
        image: zookeeper:3.7.0
        restart: on-failure
        logging: *default-logging
        volumes:
            - zookeeper-data:/data
            - zookeeper-datalog:/datalog
            - zookeeper-logs:/logs

    kafka:
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        restart: on-failure
        logging: *default-logging
        command:
            - redpanda
            - start
            - --kafka-addr
            - internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr
            - internal://kafka:9092,external://localhost:19092
            - --pandaproxy-addr
            - internal://0.0.0.0:8082,external://0.0.0.0:18082
            - --advertise-pandaproxy-addr
            - internal://kafka:8082,external://localhost:18082
            - --schema-registry-addr
            - internal://0.0.0.0:8081,external://0.0.0.0:18081
            - --rpc-addr
            - kafka:33145
            - --advertise-rpc-addr
            - kafka:33145
            - --mode
            - dev-container
            - --smp
            - '2'
            - --memory
            - 3G
            - --reserve-memory
            - 500M
            - --overprovisioned
            - --set
            - redpanda.empty_seed_starts_cluster=false
            - --seeds
            - kafka:33145
            - --set
            - redpanda.auto_create_topics_enabled=true
        environment:
            ALLOW_PLAINTEXT_LISTENER: 'true'
        healthcheck:
            test: ['CMD-SHELL', 'rpk topic list --brokers localhost:9092 >/dev/null 2>&1 || exit 1']
            interval: 5s
            timeout: 10s
            retries: 30
            start_period: 75s
        depends_on:
            - zookeeper
        volumes:
            - redpanda-data:/var/lib/redpanda/data

    kafka-init:
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        restart: 'no'
        logging: *default-logging
        entrypoint: /bin/sh
        command:
            - -c
            - |
                set -eu
                echo "Waiting for Kafka broker to accept connections..."
                timeout=60
                elapsed=0
                until rpk topic list --brokers kafka:9092 >/dev/null 2>&1; do
                    echo "Kafka broker not ready yet (elapsed: $${elapsed}s)..."
                    sleep 2
                    elapsed=$$((elapsed + 2))
                    if [ "$${elapsed}" -ge "$${timeout}" ]; then
                        echo "Timeout waiting for Kafka broker after $${timeout}s"
                        exit 1
                    fi
                done

                topics="document_embeddings_input \
                    clickhouse_events_json \
                    clickhouse_ai_events_json \
                    clickhouse_heatmap_events \
                    clickhouse_ingestion_warnings \
                    events_plugin_ingestion_dlq \
                    events_plugin_ingestion_overflow \
                    events_plugin_ingestion_async \
                    clickhouse_groups \
                    clickhouse_person \
                    clickhouse_person_distinct_id \
                    clickhouse_app_metrics2 \
                    log_entries \
                    clickhouse_tophog"
                for topic in $${topics}; do
                    if rpk topic create "$${topic}" --brokers kafka:9092 -p 1 -r 1 2>&1; then
                        echo "Topic $${topic} created"
                    elif rpk topic list --brokers kafka:9092 | grep -q "$${topic}"; then
                        echo "Topic $${topic} already exists"
                    else
                        echo "Failed to create topic $${topic}"
                        exit 1
                    fi
                done
        depends_on:
            kafka:
                condition: service_healthy

    clickhouse:
        image: ${CLICKHOUSE_SERVER_IMAGE:-clickhouse/clickhouse-server:26.3.10.60}
        restart: on-failure
        logging: *default-logging
        entrypoint: /bin/sh
        command:
            - -c
            - |
                set -eu
                mkdir -p /etc/clickhouse-server/config.d /etc/clickhouse-server/users.d
                cat > /etc/clickhouse-server/config.d/posthog.xml <<'EOF'
                <clickhouse>
                    <tcp_port>9000</tcp_port>
                    <remote_servers>
                        <posthog>
                            <shard>
                                <replica>
                                    <host>clickhouse</host>
                                    <port>9000</port>
                                </replica>
                            </shard>
                        </posthog>
                        <posthog_single_shard>
                            <shard>
                                <replica>
                                    <host>clickhouse</host>
                                    <port>9000</port>
                                </replica>
                            </shard>
                        </posthog_single_shard>
                        <posthog_migrations>
                            <shard>
                                <replica>
                                    <host>clickhouse</host>
                                    <port>9000</port>
                                </replica>
                            </shard>
                        </posthog_migrations>
                        <posthog_writable>
                            <shard>
                                <replica>
                                    <host>clickhouse</host>
                                    <port>9000</port>
                                </replica>
                            </shard>
                        </posthog_writable>
                        <posthog_primary_replica>
                            <shard>
                                <replica>
                                    <host>clickhouse</host>
                                    <port>9000</port>
                                </replica>
                            </shard>
                        </posthog_primary_replica>
                        <ai_events>
                            <shard>
                                <replica>
                                    <host>clickhouse</host>
                                    <port>9000</port>
                                </replica>
                            </shard>
                        </ai_events>
                        <aux>
                            <shard>
                                <replica>
                                    <host>clickhouse</host>
                                    <port>9000</port>
                                </replica>
                            </shard>
                        </aux>
                        <ops>
                            <shard>
                                <replica>
                                    <host>clickhouse</host>
                                    <port>9000</port>
                                </replica>
                            </shard>
                        </ops>
                        <sessions>
                            <shard>
                                <replica>
                                    <host>clickhouse</host>
                                    <port>9000</port>
                                </replica>
                            </shard>
                        </sessions>
                    </remote_servers>
                    <named_collections>
                        <msk_cluster>
                            <kafka_broker_list from_env="KAFKA_HOSTS"/>
                        </msk_cluster>
                        <warpstream_ingestion>
                            <kafka_broker_list from_env="KAFKA_HOSTS"/>
                        </warpstream_ingestion>
                        <warpstream_calculated_events>
                            <kafka_broker_list from_env="KAFKA_HOSTS"/>
                        </warpstream_calculated_events>
                        <warpstream_replay>
                            <kafka_broker_list from_env="KAFKA_HOSTS"/>
                        </warpstream_replay>
                        <warpstream_shared>
                            <kafka_broker_list from_env="KAFKA_HOSTS"/>
                        </warpstream_shared>
                        <warpstream_cyclotron>
                            <kafka_broker_list from_env="KAFKA_HOSTS"/>
                        </warpstream_cyclotron>
                    </named_collections>
                    <zookeeper>
                        <node>
                            <host>zookeeper</host>
                            <port>2181</port>
                        </node>
                    </zookeeper>
                    <distributed_ddl>
                        <path>/clickhouse/task_queue/ddl</path>
                    </distributed_ddl>
                    <macros>
                        <shard>01</shard>
                        <replica>ch1</replica>
                        <hostClusterType>online</hostClusterType>
                        <hostClusterRole>data</hostClusterRole>
                    </macros>
                </clickhouse>
                EOF
                cat > /etc/clickhouse-server/users.d/posthog.xml <<'EOF'
                <clickhouse>
                    <profiles>
                        <api>
                            <profile>default</profile>
                        </api>
                        <app>
                            <profile>default</profile>
                        </app>
                        <billing>
                            <profile>default</profile>
                        </billing>
                    </profiles>
                    <users>
                        <default>
                            <password></password>
                            <networks>
                                <ip>::/0</ip>
                            </networks>
                            <profile>default</profile>
                            <quota>default</quota>
                            <access_management>1</access_management>
                            <named_collection_control>1</named_collection_control>
                            <show_named_collections>1</show_named_collections>
                            <show_named_collections_secrets>1</show_named_collections_secrets>
                        </default>
                        <api>
                            <password>apipass</password>
                            <networks>
                                <ip>::/0</ip>
                            </networks>
                            <profile>api</profile>
                            <quota>default</quota>
                        </api>
                        <app>
                            <password>apppass</password>
                            <networks>
                                <ip>::/0</ip>
                            </networks>
                            <profile>app</profile>
                            <quota>default</quota>
                        </app>
                        <billing>
                            <password>billingpass</password>
                            <networks>
                                <ip>::/0</ip>
                            </networks>
                            <profile>billing</profile>
                            <quota>default</quota>
                        </billing>
                    </users>
                </clickhouse>
                EOF
                exec /entrypoint.sh
        environment:
            CLICKHOUSE_DB: posthog
            CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
            KAFKA_HOSTS: kafka:9092
        healthcheck:
            test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
            interval: 5s
            timeout: 10s
            retries: 30
            start_period: 30s
        depends_on:
            kafka:
                condition: service_healthy
            zookeeper:
                condition: service_started
        volumes:
            - clickhouse-data:/var/lib/clickhouse

    objectstorage:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        restart: on-failure
        logging: *default-logging
        entrypoint: sh
        command: -c 'mkdir -p /data/posthog /data/ai-blobs && minio server --address ":19000" --console-address ":19001" /data'
        environment:
            MINIO_ROOT_USER: object_storage_root_user
            MINIO_ROOT_PASSWORD: object_storage_root_password
        volumes:
            - objectstorage:/data

    seaweedfs:
        image: chrislusf/seaweedfs:4.03
        restart: on-failure
        logging: *default-logging
        entrypoint:
            - /bin/sh
            - -c
            - |
                /usr/bin/weed "$$@" &
                weed_pid=$$!
                echo "Waiting for SeaweedFS to initialize..."
                while true; do
                    sleep 5
                    echo "Checking if posthog bucket exists..."
                    if echo "s3.bucket.list" | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q "posthog"; then
                        echo "Bucket posthog exists!"
                        break
                    fi
                    echo "Bucket not found, attempting to create..."
                    echo "s3.bucket.create -name posthog" | /usr/bin/weed shell -master=localhost:9333 2>&1 || true
                    echo "Retrying in 5s..."
                done
                echo "SeaweedFS ready with posthog bucket"
                wait $${weed_pid}
            - --
        command: ['server', '-s3', '-s3.port=8333', '-filer', '-dir=/data']
        healthcheck:
            test: ['CMD-SHELL', "echo 's3.bucket.list' | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q posthog"]
            interval: 5s
            timeout: 10s
            retries: 30
            start_period: 10s
        volumes:
            - seaweedfs:/data

    personhog-replica:
        image: ghcr.io/posthog/posthog/personhog-replica:master
        restart: on-failure
        logging: *default-logging
        environment:
            GRPC_ADDRESS: 0.0.0.0:50051
            PRIMARY_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
            RUST_LOG: info
            METRICS_PORT: '9100'
        depends_on:
            db:
                condition: service_healthy

    personhog-router:
        image: ghcr.io/posthog/posthog/personhog-router:master
        restart: on-failure
        logging: *default-logging
        environment:
            GRPC_ADDRESS: 0.0.0.0:50052
            REPLICA_URL: http://personhog-replica:50051
            BACKEND_TIMEOUT_MS: '5000'
            RUST_LOG: info
            METRICS_PORT: '9101'
        depends_on:
            - personhog-replica

    capture:
        image: ghcr.io/posthog/posthog/capture:master
        restart: on-failure
        logging: *default-logging
        environment:
            ADDRESS: 0.0.0.0:3000
            KAFKA_TOPIC: events_plugin_ingestion
            KAFKA_HOSTS: kafka:9092
            REDIS_URL: redis://redis7:6379/
            CAPTURE_MODE: events
            RUST_LOG: info,rdkafka=warn
        depends_on:
            kafka:
                condition: service_healthy
            redis7:
                condition: service_healthy

    replay-capture:
        image: ghcr.io/posthog/posthog/capture:master
        restart: on-failure
        logging: *default-logging
        environment:
            ADDRESS: 0.0.0.0:3000
            KAFKA_TOPIC: session_recording_snapshot_item_events
            KAFKA_HOSTS: kafka:9092
            REDIS_URL: redis://redis7:6379/
            CAPTURE_MODE: recordings
        depends_on:
            kafka:
                condition: service_healthy
            redis7:
                condition: service_healthy

    property-defs-rs:
        image: ghcr.io/posthog/posthog/property-defs-rs:master
        restart: on-failure
        logging: *default-logging
        environment:
            DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
            KAFKA_HOSTS: kafka:9092
            SKIP_WRITES: 'false'
            SKIP_READS: 'false'
            FILTER_MODE: opt-out
        depends_on:
            kafka-init:
                condition: service_completed_successfully
            db:
                condition: service_healthy

    feature-flags:
        image: ghcr.io/posthog/posthog/feature-flags:master
        restart: on-failure
        logging: *default-logging
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3001/_readiness']
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s
        environment:
            WRITE_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
            READ_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
            PERSONS_WRITE_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
            PERSONS_READ_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
            REDIS_URL: redis://redis7:6379/
            ADDRESS: 0.0.0.0:3001
            RUST_LOG: info
            COOKIELESS_REDIS_HOST: redis7
            COOKIELESS_REDIS_PORT: '6379'
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy

    hypercache-server:
        image: ghcr.io/posthog/posthog/hypercache-server:master
        restart: on-failure
        logging: *default-logging
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3002/_readiness']
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s
        environment:
            REDIS_URL: redis://redis7:6379/
            ADDRESS: 0.0.0.0:3002
            RUST_LOG: info
        depends_on:
            redis7:
                condition: service_healthy

    livestream:
        image: ghcr.io/posthog/posthog/livestream:master
        restart: on-failure
        logging: *default-logging
        environment:
            LIVESTREAM_JWT_SECRET: $POSTHOG_SECRET
        depends_on:
            kafka:
                condition: service_started

    cyclotron-janitor:
        image: ghcr.io/posthog/posthog/cyclotron-janitor:master
        restart: on-failure
        logging: *default-logging
        environment:
            DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
            KAFKA_HOSTS: kafka:9092
            KAFKA_TOPIC: clickhouse_app_metrics2
        depends_on:
            db:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully

    migrate:
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        restart: 'no'
        logging: *default-logging
        command:
            - /bin/bash
            - -c
            - |
                set -euo pipefail
                python - <<'PY'
                import time
                import urllib.request

                ping_url = "http://clickhouse:8123/ping"
                ddl_url = "http://clickhouse:8123/"
                crash_log_sql = """CREATE TABLE IF NOT EXISTS system.crash_log (
                    hostname LowCardinality(String) DEFAULT hostName(),
                    event_date Date,
                    event_time DateTime,
                    timestamp_ns UInt64,
                    signal Int32,
                    thread_id UInt64,
                    query_id String,
                    trace Array(UInt64),
                    trace_full Array(String),
                    version String,
                    revision UInt32,
                    build_id String
                ) ENGINE = MergeTree
                ORDER BY (event_date, event_time)
                TTL event_date + INTERVAL 30 DAY"""

                for attempt in range(60):
                    try:
                        urllib.request.urlopen(ping_url, timeout=2).read()
                        break
                    except Exception:
                        if attempt == 59:
                            raise
                        time.sleep(2)

                request = urllib.request.Request(
                    ddl_url,
                    data=crash_log_sql.encode("utf-8"),
                    method="POST",
                )
                urllib.request.urlopen(request, timeout=30).read()
                PY
                ./bin/migrate
        environment:
            <<: *posthog-env
            POSTHOG_SKIP_MIGRATION_CHECKS: '1'
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            personhog-router:
                condition: service_started

    web:
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        restart: on-failure
        logging: *default-logging
        command: sh -c "./bin/start-backend & ./bin/start-frontend"
        environment:
            <<: *posthog-env
            LIVESTREAM_HOST: https://${DOMAIN}/livestream
            OPT_OUT_CAPTURE: ${OPT_OUT_CAPTURE:-false}
            OTEL_SERVICE_NAME: posthog
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            migrate:
                condition: service_completed_successfully
            objectstorage:
                condition: service_started
            seaweedfs:
                condition: service_healthy
            personhog-router:
                condition: service_started

    worker:
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        restart: on-failure
        logging: *default-logging
        command: ./bin/docker-worker-celery --with-scheduler
        environment:
            <<: *posthog-env
            POSTHOG_SKIP_MIGRATION_CHECKS: '1'
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            migrate:
                condition: service_completed_successfully
            web:
                condition: service_started
            personhog-router:
                condition: service_started

    temporal:
        image: temporalio/auto-setup:1.26.2
        restart: on-failure
        logging: *default-logging
        environment:
            DB: postgres12
            DB_PORT: '5432'
            POSTGRES_USER: posthog
            POSTGRES_PWD: posthog
            POSTGRES_SEEDS: db
            DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
            ENABLE_ES: 'false'
        healthcheck:
            test: ['CMD-SHELL', 'nc -z $$(hostname) 7233']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 300s
        depends_on:
            db:
                condition: service_healthy

    temporal-django-worker:
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        restart: on-failure
        logging: *default-logging
        command: ./bin/temporal-django-worker
        environment:
            <<: *posthog-env
            TEMPORAL_HOST: temporal
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            objectstorage:
                condition: service_started
            seaweedfs:
                condition: service_healthy
            temporal:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully

    plugins:
        image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
        restart: on-failure
        logging: *default-logging
        command: node nodejs/dist/index.js
        environment:
            <<: *posthog-env
            PERSONS_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
            BEHAVIORAL_COHORTS_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
            CYCLOTRON_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
            CYCLOTRON_NODE_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
            CDP_REDIS_HOST: redis7
            CDP_REDIS_PORT: '6379'
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            migrate:
                condition: service_completed_successfully
            objectstorage:
                condition: service_started
            seaweedfs:
                condition: service_healthy
            personhog-router:
                condition: service_started

    ingestion-general:
        image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
        restart: on-failure
        logging: *default-logging
        command: node nodejs/dist/index.js
        environment:
            <<: *posthog-env
            PLUGIN_SERVER_MODE: ingestion-v2-combined
            PERSONS_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
            BEHAVIORAL_COHORTS_DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
            COOKIELESS_REDIS_HOST: redis7
            COOKIELESS_REDIS_PORT: '6379'
            CDP_REDIS_HOST: redis7
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            migrate:
                condition: service_completed_successfully
            personhog-router:
                condition: service_started

    ingestion-sessionreplay:
        image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
        restart: on-failure
        logging: *default-logging
        command: node nodejs/dist/index.js
        environment:
            <<: *posthog-env
            PLUGIN_SERVER_MODE: recordings-blob-ingestion-v2
            SESSION_RECORDING_V2_S3_TIMEOUT_MS: '120000'
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            seaweedfs:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully

    recording-api:
        image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
        restart: on-failure
        logging: *default-logging
        command: node nodejs/dist/index.js
        environment:
            <<: *posthog-env
            PLUGIN_SERVER_MODE: recording-api
            SESSION_RECORDING_API_REDIS_HOST: redis7
            SESSION_RECORDING_API_REDIS_PORT: '6379'
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully

    proxy:
        image: caddy:2-alpine
        entrypoint: sh
        restart: always
        logging: *default-logging
        command: -c 'echo "$$CADDYFILE" > /etc/caddy/Caddyfile && exec caddy run -c /etc/caddy/Caddyfile'
        expose:
            - '80'
        environment:
            CADDYFILE: |
                :80 {
                    @replay-capture {
                        path /s
                        path /s/*
                    }
                    handle @replay-capture {
                        reverse_proxy replay-capture:3000
                    }

                    @capture {
                        path /e
                        path /e/*
                        path /i/v0
                        path /i/v0/*
                        path /batch
                        path /batch/*
                        path /capture
                        path /capture/*
                    }
                    handle @capture {
                        reverse_proxy capture:3000
                    }

                    @flags {
                        path /flags
                        path /flags/*
                    }
                    handle @flags {
                        reverse_proxy feature-flags:3001
                    }

                    @surveys {
                        path /surveys
                        path /surveys/*
                        path /api/surveys
                        path /api/surveys/*
                    }
                    handle @surveys {
                        reverse_proxy hypercache-server:3002
                    }

                    @remote-config {
                        path /array/*
                    }
                    handle @remote-config {
                        reverse_proxy hypercache-server:3002
                    }

                    @webhooks {
                        path /public/webhooks
                        path /public/webhooks/*
                        path /public/m/*
                    }
                    handle @webhooks {
                        reverse_proxy plugins:6738
                    }

                    @livestream {
                        path /livestream
                        path /livestream/*
                    }
                    handle @livestream {
                        uri strip_prefix /livestream
                        reverse_proxy livestream:8080 {
                            flush_interval -1
                        }
                    }

                    @objectstorage {
                        path /posthog
                        path /posthog/*
                    }
                    handle @objectstorage {
                        reverse_proxy objectstorage:19000
                    }

                    handle {
                        reverse_proxy web:8000
                    }
                }
        volumes:
            - caddy-data:/data
            - caddy-config:/config
        depends_on:
            - web
            - capture
            - replay-capture
            - feature-flags
            - hypercache-server
            - livestream
            - plugins
            - objectstorage

volumes:
    postgres-data:
    redis7-data:
    redpanda-data:
    zookeeper-data:
    zookeeper-datalog:
    zookeeper-logs:
    clickhouse-data:
    objectstorage:
    seaweedfs:
    caddy-data:
    caddy-config:
